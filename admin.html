<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Input - Closing Report E-commerce Tangerang</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FBF9F1] text-[#33312E] min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="w-full max-w-2xl bg-[#F5F0E6] rounded-2xl shadow-lg border border-[#E3DCD0] overflow-hidden">
        <!-- Header -->
        <div class="bg-[#8C7A6B] p-6 text-center shadow-sm">
            <h1 class="text-xl md:text-2xl font-bold tracking-wide text-[#FAF7F2]">INPUT CLOSING REPORT HARIAN</h1>
        </div>

        <!-- Form Body -->
        <form id="reportForm" class="p-6 space-y-6">
            
            <!-- Informasi Umum -->
            <div class="bg-[#FAF7F2] p-4 rounded-xl border border-[#E8E1D5] space-y-4">
                <h2 class="text-xs font-extrabold text-[#8C6D46] uppercase tracking-wider">INFORMASI UMUM</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#78726A] mb-1">NAMA CS</label>
                        <input type="text" id="cs_name" class="w-full bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2.5 text-sm font-semibold text-[#33312E] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#78726A] mb-1">TANGGAL HARI INI (DD/MM/YYYY)</label>
                        <input type="text" id="tanggal" class="w-full bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2.5 text-sm font-semibold text-[#33312E] focus:outline-none focus:ring-2 focus:ring-[#8C7A6B]" required>
                    </div>
                </div>
            </div>

            <!-- Input Performa Hari Ini -->
            <div class="bg-[#FAF7F2] p-4 rounded-xl border border-[#E8E1D5] space-y-4">
                <h2 class="text-xs font-extrabold text-[#5A7863] uppercase tracking-wider">PERFORMA HARI INI (INPUT MANUAL)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#78726A] mb-1">LEADS TODAY</label>
                        <input type="number" id="leads_today" class="w-full bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2.5 text-sm font-semibold text-[#33312E] focus:outline-none focus:ring-2 focus:ring-[#5A7863]" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#78726A] mb-1">CLOSING TODAY</label>
                        <input type="number" id="closing_today" class="w-full bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2.5 text-sm font-semibold text-[#33312E] focus:outline-none focus:ring-2 focus:ring-[#5A7863]" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#78726A] mb-1">OMZET TODAY (Rp)</label>
                        <input type="number" id="omzet_today" class="w-full bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2.5 text-sm font-semibold text-[#33312E] focus:outline-none focus:ring-2 focus:ring-[#5A7863]" required>
                    </div>
                </div>
            </div>

            <!-- Tombol Simpan & Update -->
            <div class="space-y-4 pt-2">
                <div class="bg-[#FAF7F2] p-4 rounded-xl border border-[#E8E1D5] space-y-3">
                    <button type="button" id="githubUpdateBtn" class="w-full bg-[#5A7863] hover:bg-[#496351] text-[#FAF7F2] font-bold py-3 px-4 rounded-xl shadow-md transition duration-200 text-sm flex items-center justify-center gap-2">
                        SIMPAN & UPDATE
                    </button>
                    <p id="githubStatus" class="text-xs font-semibold text-center hidden py-1"></p>

                    <p class="text-[11px] text-[#78726A] pt-1">Data hari ini akan otomatis ditambahkan ke dalam daftar riwayat harian dan memperbarui total MTD di web publik!</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="gh_repo" placeholder="username/repository-name" class="bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2 text-xs font-semibold text-[#33312E]">
                        <input type="password" id="gh_token" placeholder="GitHub Personal Access Token (ghp_...)" class="bg-[#F5F0E6] border border-[#E3DCD0] rounded-lg p-2 text-xs font-semibold text-[#33312E]">
                    </div>
                </div>
            </div>
        </form>

        <!-- Footer -->
        <div class="bg-[#EFEAE1] px-6 py-4 text-center border-t border-[#E3DCD0] space-y-1">
            <div class="text-xs text-[#8A8379] font-medium">ADMIN PANEL E-COMMERCE TANGERANG &copy; 2026</div>
            <div class="text-xs text-[#8C7A6B] font-semibold">by putradwi-dev</div>
        </div>
    </div>

    <script>
        let existingData = { cs_name: "MARVELL TANGERANG", history: [] };

        fetch('data.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                existingData = data;
                document.getElementById('cs_name').value = data.cs_name || 'MARVELL TANGERANG';
            })
            .catch(err => console.log(err));

        document.getElementById('gh_repo').value = localStorage.getItem('gh_repo') || '';
        document.getElementById('gh_token').value = localStorage.getItem('gh_token') || '';

        document.getElementById('githubUpdateBtn').addEventListener('click', async () => {
            const repo = document.getElementById('gh_repo').value.trim();
            const token = document.getElementById('gh_token').value.trim();
            const statusEl = document.getElementById('githubStatus');

            if (!repo || !token) {
                alert("Harap isi Username/Repository dan GitHub Token terlebih dahulu!");
                return;
            }

            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);

            const newEntry = {
                tanggal: document.getElementById('tanggal').value,
                leads_today: parseInt(document.getElementById('leads_today').value) || 0,
                closing_today: parseInt(document.getElementById('closing_today').value) || 0,
                omzet_today: parseInt(document.getElementById('omzet_today').value) || 0
            };

            if (!newEntry.tanggal) {
                alert("Tanggal harus diisi!");
                return;
            }

            // Cek apakah tanggal yang sama sudah ada di history, jika ada update, jika belum tambahkan ke history
            const existingIndex = existingData.history.findIndex(h => h.tanggal === newEntry.tanggal);
            if (existingIndex >= 0) {
                existingData.history[existingIndex] = newEntry;
            } else {
                existingData.history.push(newEntry);
            }

            existingData.cs_name = document.getElementById('cs_name').value;

            statusEl.classList.remove('hidden', 'text-emerald-700', 'text-rose-600');
            statusEl.classList.add('text-[#8C7A6B]');
            statusEl.innerText = "Sedang memperbarui data...";

            try {
                const url = `https://api.github.com/repos/${repo}/contents/data.json`;
                let sha = "";
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(existingData, null, 4))));
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update harian report (${new Date().toLocaleString('id-ID')})`,
                        content: contentEncoded,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    statusEl.className = "text-xs font-semibold text-center text-emerald-700 py-1";
                    statusEl.innerText = "BERHASIL SIMPAN & UPDATE.";
                } else {
                    const errData = await putRes.json();
                    throw new Error(errData.message || "Gagal meng-update file di GitHub.");
                }
            } catch (err) {
                statusEl.className = "text-xs font-semibold text-center text-rose-600 py-1";
                statusEl.innerText = "❌ Terjadi Kesalahan: " + err.message;
            }
        });
    </script>
</body>
</html>
